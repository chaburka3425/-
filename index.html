<!DOCTYPE html><html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Илья собирает бутылки</title><style>
body {
    background: #171727;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

canvas {
    background: #263448;
    border: 3px solid lime;
    max-width: 95vw;
    height: auto;
}

button {
    padding: 12px 20px;
    font-size: 18px;
    cursor: pointer;
}
</style></head><body><h1>🎮 ИЛЬЯ СОБИРАЕТ БУТЫЛКИ 🍾</h1>
<h2 id="score">Собрано бутылок: 0</h2><canvas id="game" width="600" height="400"></canvas>

<p>Управление: W A S D или стрелки</p>
<button onclick="restart()">Начать заново</button><script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const img = new Image();
img.src = "player.jpg";

const playerSize = 80;

let x, y, bottleX, bottleY, score, keys, timer;

function newBottle() {
    bottleX = Math.floor(Math.random() * 28) * 20;
    bottleY = Math.floor(Math.random() * 18) * 20;
}

function restart() {
    clearInterval(timer);

    x = 100;
    y = 100;
    score = 0;
    keys = {};

    newBottle();

    document.getElementById("score").textContent =
        "Собрано бутылок: 0";

    timer = setInterval(update, 30);

    draw();
}

document.addEventListener("keydown", e => {
    const key = e.key.toLowerCase();

    if (["w", "a", "s", "d", "arrowup", "arrowdown",
         "arrowleft", "arrowright"].includes(key)) {
        keys[key] = true;
        e.preventDefault();
    }
});

document.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

function update() {
    if (keys["w"] || keys["arrowup"]) y -= 5;
    if (keys["s"] || keys["arrowdown"]) y += 5;
    if (keys["a"] || keys["arrowleft"]) x -= 5;
    if (keys["d"] || keys["arrowright"]) x += 5;

    x = Math.max(0, Math.min(canvas.width - playerSize, x));
    y = Math.max(0, Math.min(canvas.height - playerSize, y));

    if (
        x < bottleX + 25 &&
        x + playerSize > bottleX &&
        y < bottleY + 25 &&
        y + playerSize > bottleY
    ) {
        score++;

        document.getElementById("score").textContent =
            "Собрано бутылок: " + score;

        newBottle();
    }

    draw();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.font = "28px Arial";
    ctx.fillText("🍾", bottleX, bottleY + 25);

    if (img.complete && img.naturalWidth > 0) {
        ctx.drawImage(img, x, y, playerSize, playerSize);
    } else {
        ctx.fillStyle = "lime";
        ctx.fillRect(x, y, playerSize, playerSize);

        ctx.fillStyle = "black";
        ctx.font = "20px Arial";
        ctx.fillText("ИЛЬЯ", x + 5, y + 45);
    }
}

img.onload = draw;

img.onerror = () => {
    console.log("Не удалось загрузить player.jpg");
};

restart();
</script></body>
</html>
